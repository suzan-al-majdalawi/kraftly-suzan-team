services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      API_URL: http://api:4000
      API_KEY: ${API_KEY:?API_KEY saknas – kör cp .env.example .env}
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: mock-api/Dockerfile
    env_file:
      - ./.env
    ports:
      - "4000:4000"
    environment:
      API_KEY: ${API_KEY:?API_KEY saknas – kör cp .env.example .env}
