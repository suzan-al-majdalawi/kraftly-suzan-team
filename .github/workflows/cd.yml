name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test & bygg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run build

  publish:
    name: Image → GHCR
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Imagenamn
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Bygg imagen
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .
      - name: Logga in på GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pusha
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"

  deploy:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Be Render köra exakt den här imagen
        id: hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK saknas i miljön staging – hoppar över deploy"
            exit 0
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          ENCODED=$(jq -rn --arg u "$IMAGE" '$u|@uri')
          curl -fsS -X POST "${HOOK}&imgURL=${ENCODED}"
          echo
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Vänta tills staging kör den här committen
        if: steps.hook.outputs.deployed == 'true'
        env:
          URL: ${{ vars.STAGING_URL }}
        run: |
          : "${URL:?STAGING_URL saknas i miljön staging}"
          URL="${URL%/}"
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS "$URL/version.txt" 2>/dev/null || true)
            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              echo "✅ $URL kör $GITHUB_SHA"
              exit 0
            fi
            echo "Försök $i/30: staging kör ${LIVE:-(inget svar ännu)} – väntar 10 s"
            sleep 10
          done
          echo "::error::Staging kör inte $GITHUB_SHA efter 5 minuter"
          exit 1